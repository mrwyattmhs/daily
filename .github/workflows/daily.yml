name: Publish daily puzzles

on:
  # Rebuild whenever code changes, so a push doesn't wait for the next cron.
  # Safe from looping: commits made with GITHUB_TOKEN don't trigger workflows.
  push:
    branches: [main]
    paths:
      - 'v1/**'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    # The page is no longer built for a specific date — it reads the reader's
    # date and fetches from a 30-day buffer of committed puzzle files. So this
    # job has no deadline: it only tops the buffer up. If GitHub runs it hours
    # late, or skips a day, or skips a week, the site still shows the right
    # puzzles every morning.
    #
    # Two slots rather than three, purely as cheap redundancy.
    #   08:09 UTC = 04:09 EDT / 03:09 EST
    #   14:23 UTC = 10:23 EDT / 09:23 EST
    - cron: '9 8 * * *'
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate puzzle files that already exist'
        type: boolean
        default: false
      days:
        description: 'How many days to keep buffered (default 30)'
        required: false

# Never let two runs push at once.
concurrency:
  group: daily-puzzles
  cancel-in-progress:
