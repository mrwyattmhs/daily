name: Publish daily puzzles

on:
  # Rebuild whenever code changes, so a push doesn't wait for the next cron.
  # Safe from looping: commits made with GITHUB_TOKEN don't trigger workflows.
  push:
    branches: [main]
    paths:
      - 'v1/**'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    # The page is no longer built for a specific date — it reads the reader's
    # date and fetches from a 30-day buffer of committed puzzle files. So this
    # job has no deadline: it only tops the buffer up. If GitHub runs it hours
    # late, or skips a day, or skips a week, the site still shows the right
    # puzzles every morning.
    #
    # Two slots rather than three, purely as cheap redundancy.
    #   08:09 UTC = 04:09 EDT / 03:09 EST
    #   14:23 UTC = 10:23 EDT / 09:23 EST
    - cron: '9 8 * * *'
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate puzzle files that already exist'
        type: boolean
        default: false
      days:
        description: 'How many days to keep buffered (default 30)'
        required: false

# Never let two runs push at once.
concurrency:
  group: daily-puzzles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # There is deliberately no "date" input and no skip guard any more.
      #
      # The date input caused a long-running bug: re-running an old workflow run
      # replays its original inputs, so a re-run kept rebuilding a weeks-old day
      # and putting it back on the site. With the page resolving its own date
      # there is nothing for that input to usefully do, so it's gone.
      #
      # The guard is gone too. Generation skips days that already exist, so a
      # repeat run costs a second or two and commits nothing.
      - name: Top up the puzzle buffer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUZZLE_DAYS: ${{ inputs.days }}
        run: |
          echo "Today (America/New_York): $(TZ=America/New_York date +%F)"
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/generate-daily.js --force
          else
            node scripts/generate-daily.js
          fi

      - name: Build the page shell
        run: node scripts/build-site.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html puzzles
          if git diff --cached --quiet; then
            echo "nothing to commit; buffer already full and shell unchanged"
            exit 0
          fi
          git commit -m "Top up puzzles ($(TZ=America/New_York date +%F))"
          # A concurrent run or a manual push could have moved main underneath us.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
